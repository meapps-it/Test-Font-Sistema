workflows:
  android-debug:
    name: Test Font Sistema - APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Crea progetto Android
        script: |
          mkdir -p app/src/main/java/com/meapps/fonttest
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TestFontSistema"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.meapps.fonttest"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.meapps.fonttest"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Test Font Sistema"
                  android:theme="@style/Theme.TestFontSistema">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TestFontSistema" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/meapps/fonttest/MainActivity.kt <<'EOF'
          package com.meapps.fonttest

          import android.os.Bundle
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              FontSystemTest()
                          }
                      }
                  }
              }
          }

          @Composable
          fun FontSystemTest() {
              val context = LocalContext.current
              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(22.dp)
              ) {
                  Text("Test font di sistema", fontSize = 30.sp)
                  Text("Questo testo è Jetpack Compose. Nessun font personalizzato.", fontSize = 21.sp)
                  AndroidView(
                      modifier = Modifier.fillMaxWidth(),
                      factory = {
                          TextView(context).apply {
                              text = "Questo testo è un TextView Android nativo classico. Nessun font personalizzato."
                              textSize = 21f
                          }
                      }
                  )
                  Button(onClick = {}) { Text("Pulsante Android") }
                  Text("Aa Bb Cc 0123456789", fontSize = 28.sp)
              }
          }
          EOF

      - name: Crea Gradle wrapper
        script: |
          gradle wrapper --gradle-version 8.9

      - name: Compila APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/*.apk
